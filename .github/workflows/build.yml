name: macOS engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['*.md']
permissions:
  contents: read
jobs:
  universal:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apple dependencies
        run: bash Scripts/fetch-dependencies.sh
      - name: Verify and prepare engine
        run: python3 Scripts/prepare-engine.py
      - name: Configure universal app
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'
      - name: Compile
        run: cmake --build build --parallel 3
      - name: Verify and package
        run: bash Scripts/package.sh
      - name: Hosted Mac offline AI smoke
        id: smoke
        continue-on-error: true
        run: python3 Scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrm-macOS-universal
          path: dist/
          retention-days: 30
  apple-silicon:
    needs: universal
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Wyrm-macOS-universal
          path: downloaded
      - name: Unpack shipped app
        run: |
          mkdir -p build
          ditto -x -k downloaded/Wyrm-macOS-universal.zip build
          lipo -verify_arch arm64 build/Wyrm.app/Contents/MacOS/Wyrm
      - name: Hosted Apple Silicon offline AI smoke
        continue-on-error: true
        run: python3 Scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrm-Apple-Silicon-smoke
          path: dist/
          retention-days: 30
